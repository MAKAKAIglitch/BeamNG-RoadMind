<div class="bngApp roadmind-app" style="width:100%;height:100%;display:flex;flex-direction:column;background:rgba(8,14,24,.96);color:#e8f2ff;font-family:Arial,sans-serif;overflow:hidden;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(110,160,200,.25);">
    <div>
      <div style="font-size:14px;font-weight:700;letter-spacing:.08em;">ROADMIND <span style="color:#61d8ff;">LiDAR</span></div>
      <div style="font-size:10px;color:#8ea9bd;">FORWARD SENSOR · 120° FOV · 60 m</div>
    </div>
    <div style="font-size:10px;color:#78f0b0;">{{statusText}}</div>
  </div>

  <div style="position:relative;flex:1;min-height:0;padding:4px 8px;">
    <canvas style="width:100%;height:100%;display:block;"></canvas>
    <div style="position:absolute;left:12px;top:8px;font-size:10px;color:#9bb5c9;pointer-events:none;">
      {{pointCount}} POINTS · FRAME {{sequence}}
    </div>
  </div>

  <div style="display:flex;gap:6px;padding:7px 8px;border-top:1px solid rgba(110,160,200,.25);">
    <button ng-click="toggleSensor()" style="flex:1;padding:7px 5px;border:1px solid rgba(90,190,220,.5);background:{{sensorEnabled ? 'rgba(24,105,115,.65)' : 'rgba(70,75,85,.65)'}};color:#fff;border-radius:3px;font-size:11px;">
      {{sensorEnabled ? 'SENSOR ON' : 'SENSOR OFF'}}
    </button>
    <button ng-click="togglePoints()" style="flex:1;padding:7px 5px;border:1px solid rgba(90,190,220,.5);background:rgba(25,45,62,.9);color:#fff;border-radius:3px;font-size:11px;">
      {{showPoints ? 'POINTS ON' : 'POINTS OFF'}}
    </button>
  </div>

  <div style="padding:0 9px 7px;font-size:10px;color:#829caf;">
    AUTOPILOT: <span style="color:#f2c879;">PLANNED · SENSOR PROTOTYPE</span>
  </div>
</div>
